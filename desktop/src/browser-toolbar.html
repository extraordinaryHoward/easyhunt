<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><style>body{margin:0;font:14px -apple-system,"PingFang SC",sans-serif;background:#102c38;color:white;display:flex;align-items:center;gap:12px;padding:16px}button{background:#1c847b;border:0;border-radius:7px;color:white;padding:8px 14px;cursor:pointer}#status{flex:1}</style><strong>Easyhunt 浏览器</strong><span id="platform">平台：加载中</span><span id="status">状态：待命</span><button id="toggle">人工接管 / 暂停</button><button id="back">返回工作台</button><script type="module">let ref='',paused=false;async function refresh(){try{const x=await window.easyhunt.rpa('/sessions');const s=x.body.sessions?.[0];if(s){ref=s.sessionRef;paused=s.paused;document.querySelector('#platform').textContent='平台：'+(s.platform||'未知');document.querySelector('#status').textContent='状态：'+(paused?'人工接管':'运行中');document.querySelector('#toggle').textContent=paused?'继续任务':'人工接管 / 暂停';}}catch{}}document.querySelector('#toggle').onclick=async()=>{if(ref){await window.easyhunt.rpa('/sessions/'+ref+'/control','POST',{action:paused?'session.resume':'session.pause'});setTimeout(refresh,400)}};document.querySelector('#back').onclick=()=>window.easyhunt.showBrowser(false);setInterval(refresh,1500);refresh();</script></html>
