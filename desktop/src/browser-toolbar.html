<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Easyhunt 浏览器</title><style>
*{box-sizing:border-box}body{margin:0;background:#151719;color:#f8f8f8;font:12px -apple-system,"PingFang SC",sans-serif}.top,.nav{display:flex;align-items:center;gap:9px;padding:0 12px}.top{height:32px;border-bottom:1px solid #303439}.nav{height:42px}strong{font-size:13px;letter-spacing:.02em}#platform{color:#aeb5bc}#status{margin-left:auto;color:#aeb5bc}button{border:1px solid #4b5055;background:#202428;color:#fff;border-radius:5px;padding:5px 9px;font:inherit;cursor:pointer;white-space:nowrap}button:hover{background:#343a40}button:disabled{opacity:.4;cursor:default}.address{flex:1;min-width:100px;height:30px;border:1px solid #4b5055;border-radius:5px;background:#272b2f;color:white;padding:0 10px;font:12px -apple-system,"PingFang SC",sans-serif;outline:none}.address:focus{border-color:#fff}#toggle{background:#fff;color:#111;border-color:#fff}#toggle:hover{background:#e6e6e6}
</style><div class="top"><strong>Easyhunt / Browser</strong><span id="platform">BOSS 直聘</span><span id="status">待命</span><button id="toggle">人工接管</button><button id="back-workbench">返回工作台</button></div><div class="nav"><button id="prev" title="后退">←</button><button id="next" title="前进">→</button><button id="reload" title="刷新">↻</button><input class="address" id="address" aria-label="地址栏" spellcheck="false"><button id="go">前往</button></div><script>
let ref='',paused=false;
async function refresh(){try{const x=await window.easyhunt.rpa('/sessions');const s=x.body.sessions?.[0];if(s){ref=s.sessionRef;paused=s.paused;document.querySelector('#platform').textContent=s.platform==='boss'?'BOSS 直聘':s.platform||'浏览器';document.querySelector('#status').textContent=paused?'人工接管中':'运行中';document.querySelector('#toggle').textContent=paused?'继续任务':'人工接管';}const browser=await window.easyhunt.browserControls('state');const address=document.querySelector('#address');if(document.activeElement!==address)address.value=browser.url;document.querySelector('#prev').disabled=!browser.canGoBack;document.querySelector('#next').disabled=!browser.canGoForward;}catch{}}
async function action(name,value){try{await window.easyhunt.browserControls(name,value);await refresh();}catch(error){document.querySelector('#status').textContent=error.message||'操作失败';}}
document.querySelector('#prev').onclick=()=>action('back');document.querySelector('#next').onclick=()=>action('forward');document.querySelector('#reload').onclick=()=>action('reload');document.querySelector('#go').onclick=()=>action('go',document.querySelector('#address').value);document.querySelector('#address').onkeydown=event=>{if(event.key==='Enter')action('go',event.currentTarget.value)};
document.querySelector('#toggle').onclick=async()=>{if(ref){await window.easyhunt.rpa('/sessions/'+ref+'/control','POST',{action:paused?'session.resume':'session.pause'});await refresh();}};document.querySelector('#back-workbench').onclick=()=>window.easyhunt.showBrowser(false);
setInterval(refresh,1500);refresh();
</script></html>
