name: desktop-build
on: [workflow_dispatch]
jobs:
  package:
    strategy:
      matrix:
        include:
          - os: macos-latest
            command: dist:mac
          - os: windows-latest
            command: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: rpa-engine
      - run: npm run build
        working-directory: rpa-engine
      - run: npm ci
        working-directory: user-webapp
      - run: npm run build
        working-directory: user-webapp
      - run: npm ci
        working-directory: desktop
      - run: npm run ${{ matrix.command }}
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Easyhunt-${{ matrix.os }}
          path: desktop/release/*
